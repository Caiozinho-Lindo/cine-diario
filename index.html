<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diário Cinematográfico do Casal</title>
<link rel="stylesheet" href="css/global.css" />
<link rel="stylesheet" href="css/themes.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="theme-casal" data-page="login">

  <div class="login-screen">
    <div class="login-backdrop">
      <div class="beam beam-left"></div>
      <div class="beam beam-right"></div>
      <div class="grain"></div>
    </div>

    <div class="login-card">
      <div class="login-logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect x="4" y="10" width="40" height="28" rx="3" stroke="currentColor" stroke-width="2"/>
          <path d="M4 18h40M12 10v8M20 10v8M28 10v8M36 10v8" stroke="currentColor" stroke-width="2"/>
        </svg>
        <h1>Diário Cinematográfico</h1>
        <p>o nosso histórico de filmes e séries assistidos juntos</p>
      </div>

      <form id="login-form" class="login-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
        <p class="login-error" id="login-error" hidden></p>
      </form>
    </div>
  </div>

  <script src="config.js" onerror="document.getElementById('login-error').hidden=false; document.getElementById('login-error').textContent='config.js não encontrado. Copie config.example.js para config.js e preencha suas chaves.'"></script>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
