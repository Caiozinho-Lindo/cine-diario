<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catálogo — Para assistir — Cine Diário</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="../css/global.css" />
<link rel="stylesheet" href="../css/themes.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body class="theme-casal" data-page="wishlist">

  <nav class="navbar" id="navbar"></nav>

  <main class="container catalog-subpage">
    <header class="catalog-page-header">
      <div>
        <h2>Catálogo</h2>
        <p>Seus títulos assistidos e os que ainda estão na lista.</p>
      </div>
    </header>

    <nav class="catalog-tabs" aria-label="Seções do catálogo">
      <a href="catalog.html">Todos</a>
      <a href="catalog.html?secao=assistidos">✓ Assistidos</a>
      <a class="active" href="wishlist.html" aria-current="page">🎲 Para assistir</a>
    </nav>

    <p class="catalog-tab-description">
      Filmes e séries que vocês querem assistir juntos. Adicione novos abaixo e gire a roleta na hora de decidir.
    </p>

    <!-- Busca / adicionar à lista -->
    <div class="form-section">
      <h3>Adicionar à lista</h3>
      <div class="search-box">
        <input type="search" id="wishlist-search-input" placeholder="Digite o nome do filme ou série..." autocomplete="off" />
      </div>
      <div id="wishlist-search-results" class="search-results"></div>
    </div>

    <!-- Roleta -->
    <div class="form-section" id="roulette-section" hidden>
      <h3>Girar a roleta</h3>
      <div class="roulette-wrap">
        <div class="roulette-pointer">▼</div>
        <div class="roulette-wheel-outer">
          <svg id="roulette-wheel" viewBox="0 0 400 400"></svg>
        </div>
      </div>
      <div style="display:flex; justify-content:center; margin-top: 18px;">
        <button type="button" class="btn btn-primary" id="spin-btn">🎲 Girar a roleta</button>
      </div>

      <div class="roulette-winner" id="roulette-winner" hidden></div>
    </div>

    <!-- Lista de títulos -->
    <div class="form-section">
      <h3>Lista atual</h3>
      <div id="wishlist-grid" class="wishlist-grid"></div>
    </div>
  </main>

  <script src="../config.js"></script>
  <script type="module" src="../js/pages/wishlist.js"></script>
</body>
</html>
