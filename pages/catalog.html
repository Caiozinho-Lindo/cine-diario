<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catálogo — Cine Diário</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="../css/global.css" />
<link rel="stylesheet" href="../css/themes.css" />
<link rel="stylesheet" href="../css/components.css?v=20260902.2" />
<link rel="stylesheet" href="../css/responsive.css?v=20260902.2" />
</head>
<body class="theme-cinema" data-page="catalog">

  <nav class="navbar" id="navbar"></nav>

  <main class="container catalog-page">
    <header class="catalog-page-header">
      <div>
        <h2>Catálogo</h2>
        <p id="catalog-total-count">Carregando os títulos do espaço…</p>
      </div>
      <button class="btn btn-primary catalog-add-button" id="open-add-view" type="button">+ Adicionar título</button>
    </header>

    <section id="catalog-view">
      <div class="catalog-search">
        <span class="catalog-search-icon" aria-hidden="true">⌕</span>
        <input type="search" id="f-busca" placeholder="Busque no catálogo ou encontre um título novo…" autocomplete="off" />
      </div>

      <div class="catalog-toolbar">
        <div class="catalog-tabs" role="tablist" aria-label="Estado dos títulos">
          <button class="active" type="button" role="tab" aria-selected="true" data-catalog-section="todos">Todos</button>
          <button type="button" role="tab" aria-selected="false" data-catalog-section="assistidos">Assistidos</button>
          <button type="button" role="tab" aria-selected="false" data-catalog-section="para_assistir">Para assistir</button>
        </div>

        <div class="catalog-primary-filters">
          <label class="visually-hidden" for="f-tipo">Tipo</label>
          <select id="f-tipo">
            <option value="todos">Filmes e séries</option>
            <option value="filme">Filmes</option>
            <option value="serie">Séries</option>
          </select>

          <label class="visually-hidden" for="f-genero">Gênero</label>
          <select id="f-genero"><option value="">Todos os gêneros</option></select>

          <label class="visually-hidden" for="f-ordenacao">Ordenação</label>
          <select id="f-ordenacao">
            <option value="recentes">Mais recentes</option>
            <option value="antigos">Mais antigos</option>
            <option value="maior_nota">Maior nota</option>
            <option value="menor_nota">Menor nota</option>
            <option value="alfabetica">Ordem alfabética</option>
          </select>

          <button class="btn btn-secondary catalog-more-filters" id="toggle-extra-filters" type="button" aria-expanded="false" aria-controls="catalog-extra-filters">Mais filtros</button>
        </div>
      </div>

      <div class="catalog-extra-filters" id="catalog-extra-filters" hidden>
        <div class="field">
          <label for="f-avaliacao">Avaliação</label>
          <select id="f-avaliacao">
            <option value="">Qualquer avaliação</option>
            <option value="assistiriamos">Assistiríamos novamente</option>
            <option value="nao_assistiriamos">Não assistiríamos novamente</option>
            <option value="pendentes">Pendentes para mim</option>
            <option value="maior_igual_7">Nota ≥ 7</option>
            <option value="menor_7">Nota &lt; 7</option>
            <option value="faixa_9_10">Nota 9 a 10</option>
            <option value="faixa_8_89">Nota 8 a 8,9</option>
            <option value="faixa_7_79">Nota 7 a 7,9</option>
            <option value="abaixo_7">Nota abaixo de 7</option>
          </select>
        </div>
        <div class="field">
          <label for="f-ano">Ano</label>
          <select id="f-ano"><option value="">Todos os anos</option></select>
        </div>
        <button class="btn btn-secondary" id="clear-catalog-filters" type="button">Limpar filtros</button>
      </div>

      <div class="catalog-results-header">
        <div id="results-count"></div>
      </div>

      <div id="cards-grid" class="cards-grid"></div>

      <div class="catalog-load-more-wrap">
        <button class="btn btn-secondary" id="catalog-load-more" type="button" hidden>Carregar mais</button>
      </div>
    </section>

    <section id="catalog-add-view" class="catalog-add-view" hidden>
      <div class="catalog-add-header">
        <div>
          <span class="eyebrow">Dentro do catálogo</span>
          <h2 id="catalog-add-title">Adicionar filme ou série</h2>
          <p id="catalog-add-description">Pesquise o título, selecione o resultado correto e registre sua avaliação.</p>
        </div>
        <button class="btn btn-secondary" id="close-add-view" type="button">← Voltar ao catálogo</button>
      </div>

      <div id="catalog-add-search-step">
        <div class="search-box">
          <input type="search" id="catalog-add-search" placeholder="Busque um filme ou série..." autocomplete="off" />
        </div>
        <div id="catalog-add-results" class="search-results"></div>
      </div>

      <form id="catalog-add-form" class="catalog-add-form" hidden>
        <div class="selected-title-preview" id="catalog-selected-preview"></div>

        <div class="form-row">
          <div class="field">
            <label for="catalog-watched-date">Data em que foi assistido (opcional)</label>
            <input type="date" id="catalog-watched-date" />
          </div>
          <div class="field">
            <label for="catalog-review-date">Data da sua avaliação</label>
            <input type="date" id="catalog-review-date" required />
          </div>
        </div>

        <div class="person-form-block">
          <h3 id="catalog-review-title">⭐ Sua avaliação</h3>
          <div class="field">
            <label for="catalog-rating">Nota (0 a 10)</label>
            <div class="rating-input-group">
              <input type="range" id="catalog-rating" min="0" max="10" step="0.5" value="7" />
              <span class="rating-value" id="catalog-rating-display">7,0</span>
            </div>
          </div>
          <div class="field">
            <label for="catalog-observation">Sua observação (opcional)</label>
            <textarea id="catalog-observation" rows="3" placeholder="O que você achou?"></textarea>
          </div>
        </div>

        <div class="catalog-add-actions">
          <button type="submit" class="btn btn-primary" id="catalog-save-title">Adicionar ao catálogo</button>
          <button type="button" class="btn btn-secondary" id="catalog-change-title">Escolher outro</button>
          <button type="button" class="btn btn-secondary" id="catalog-cancel-add">Cancelar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="../config.js"></script>
  <script type="module" src="../js/pages/catalog.js?v=20260902.2"></script>
</body>
</html>
