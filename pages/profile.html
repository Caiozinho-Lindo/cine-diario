<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Perfil e espaços · Cine Diário</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="../css/global.css" />
<link rel="stylesheet" href="../css/themes.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/profile.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body class="theme-casal" data-page="profile">
  <nav id="navbar" class="navbar"></nav>
  <main class="page-container settings-page">
    <header class="page-header">
      <div><span class="eyebrow">Sua conta</span><h1>Perfil e espaços</h1></div>
    </header>

    <div class="settings-grid">
      <section class="settings-card">
        <h2>Personalização</h2>
        <form id="profile-form" class="settings-form">
          <div class="field">
            <label for="profile-name">Nome de exibição</label>
            <input id="profile-name" type="text" required minlength="2" maxlength="80" />
          </div>
          <div class="field">
            <label for="profile-avatar">URL do avatar <small>(opcional)</small></label>
            <input id="profile-avatar" type="url" inputmode="url" placeholder="https://..." />
          </div>
          <div class="field">
            <label for="profile-theme">Tema</label>
            <select id="profile-theme">
              <option value="casal">Cinema</option>
              <option value="caio">Azul-marinho</option>
              <option value="noemy">Lavanda</option>
            </select>
          </div>
          <div class="field">
            <label for="profile-color">Cor de destaque <small>(opcional)</small></label>
            <input id="profile-color" type="color" value="#c98fd0" />
          </div>
          <button class="btn btn-primary" id="save-profile-btn" type="submit">Salvar perfil</button>
        </form>
      </section>

      <section class="settings-card">
        <h2>Seus espaços</h2>
        <p class="settings-help">Use um espaço pessoal ou compartilhe um catálogo com casal, família, amigos e grupos.</p>
        <div id="spaces-list" class="spaces-list"></div>
        <button class="btn btn-secondary" id="show-space-form" type="button">Criar novo espaço</button>

        <form id="space-form" class="settings-form compact-form" hidden>
          <div class="field">
            <label for="space-name">Nome do espaço</label>
            <input id="space-name" type="text" required maxlength="80" placeholder="Ex.: Cinema da família" />
          </div>
          <div class="field">
            <label for="space-type">Tipo</label>
            <select id="space-type">
              <option value="casal">Casal</option>
              <option value="familia">Família</option>
              <option value="amigos">Amigos</option>
              <option value="clube">Clube de cinema</option>
              <option value="outro">Outro grupo</option>
              <option value="pessoal">Pessoal</option>
            </select>
          </div>
          <button class="btn btn-primary" id="create-space-btn" type="submit">Criar espaço</button>
        </form>
      </section>
    </div>
  </main>
  <script src="../config.js"></script>
  <script type="module" src="../js/pages/profile.js"></script>
</body>
</html>
