<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Perfil e espaços · Cine Diário</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="../css/global.css" />
<link rel="stylesheet" href="../css/themes.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/profile.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body class="theme-cinema" data-page="profile">
  <nav id="navbar" class="navbar"></nav>
  <main class="page-container settings-page">
    <header class="page-header">
      <div><span class="eyebrow">Sua conta</span><h1>Perfil e espaços</h1></div>
    </header>

    <div class="settings-grid">
      <section class="settings-card">
        <h2>Personalização</h2>
        <div id="profile-preview" class="profile-preview" aria-live="polite"></div>
        <form id="profile-form" class="settings-form">
          <div class="field">
            <label for="profile-name">Nome de exibição</label>
            <input id="profile-name" type="text" required minlength="2" maxlength="80" />
          </div>
          <div class="field">
            <label for="profile-avatar">URL do avatar <small>(opcional)</small></label>
            <input id="profile-avatar" type="url" inputmode="url" placeholder="https://..." />
          </div>
          <div class="field">
            <label for="profile-theme">Tema</label>
            <select id="profile-theme">
              <option value="cinema">Cinema</option>
              <option value="azul">Azul-marinho</option>
              <option value="lavanda">Lavanda</option>
            </select>
          </div>
          <div class="field">
            <label for="profile-color">Cor de destaque <small>(opcional)</small></label>
            <input id="profile-color" type="color" value="#c98fd0" />
          </div>
          <section id="streamings" class="profile-streamings">
            <h3>Seus streamings</h3>
            <p class="settings-help">O recomendador usa estes serviços quando você participa da escolha.</p>
            <div id="streamings-options" class="streamings-options"></div>
          </section>
          <button class="btn btn-primary" id="save-profile-btn" type="submit">Salvar perfil</button>
        </form>
      </section>

      <section class="settings-card">
        <h2>Seus espaços</h2>
        <p class="settings-help">Tenha seu próprio catálogo ou compartilhe um espaço com outras pessoas.</p>
        <div id="spaces-list" class="spaces-list"></div>
        <div class="space-entry-actions">
          <button class="btn btn-secondary" id="show-space-form" type="button">Criar novo espaço</button>
          <button class="btn btn-secondary" id="show-join-form" type="button">Entrar com código</button>
        </div>

        <form id="space-form" class="settings-form compact-form" hidden>
          <div class="field">
            <label for="space-name">Nome do espaço</label>
            <input id="space-name" type="text" required maxlength="80" placeholder="Ex.: Cinema da família" />
          </div>
          <button class="btn btn-primary" id="create-space-btn" type="submit">Criar espaço</button>
        </form>

        <form id="join-space-form" class="settings-form compact-form" hidden>
          <div class="field">
            <label for="join-code">Código do convite</label>
            <input id="join-code" type="text" required minlength="12" maxlength="14" autocomplete="off" placeholder="Ex.: A1B2C3D4E5F6" />
          </div>
          <button class="btn btn-primary" id="join-space-btn" type="submit">Ver convite</button>
        </form>

        <section id="active-space-panel" class="active-space-panel">
          <div class="subsection-heading">
            <div>
              <span class="eyebrow">Espaço ativo</span>
              <h3 id="active-space-title"></h3>
            </div>
            <span id="current-role" class="chip"></span>
          </div>

          <form id="edit-space-form" class="settings-form compact-form" hidden>
            <div class="field">
              <label for="edit-space-name">Nome do espaço</label>
              <input id="edit-space-name" type="text" required maxlength="80" />
            </div>
            <button class="btn btn-primary" id="save-space-btn" type="submit">Salvar espaço</button>
          </form>

          <div class="members-heading">
            <h3>Membros</h3>
            <small id="members-count"></small>
          </div>
          <div id="members-list" class="members-list"></div>
          <p id="sharing-note" class="settings-help sharing-note"></p>
          <div id="invite-actions" class="invite-actions" hidden>
            <button class="btn btn-secondary" data-space-action="code" type="button">Código</button>
            <button class="btn btn-primary" data-space-action="invite" type="button">Convidar</button>
          </div>
          <div id="invite-result" class="invite-result" hidden>
            <span class="eyebrow">Código do convite</span>
            <strong id="invite-code-value"></strong>
            <small id="invite-expiration"></small>
            <div class="invite-copy-actions">
              <button class="btn btn-secondary btn-sm" data-space-action="copy-code" type="button">Copiar código</button>
              <button class="btn btn-secondary btn-sm" data-space-action="copy-link" type="button">Copiar link</button>
            </div>
          </div>
          <div id="space-actions" class="space-actions"></div>
        </section>
      </section>
    </div>
  </main>
  <script src="../config.js"></script>
  <script type="module" src="../js/pages/profile.js"></script>
</body>
</html>
