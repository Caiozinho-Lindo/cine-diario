<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Editar e avaliar — Cine Diário</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="../css/global.css" />
<link rel="stylesheet" href="../css/themes.css?v=20260910.1" />
<link rel="stylesheet" href="../css/components.css?v=20260925.3" />
<link rel="stylesheet" href="../css/responsive.css?v=20260925.1" />
</head>
<body class="theme-cinema app-loading" data-page="edit">
<script src="../js/themeBoot.js?v=20260925.1"></script>
  <div id="app-startup" class="app-startup" role="status" aria-live="polite">
    <div class="app-startup-card">
      <div class="app-startup-logo" aria-hidden="true">▤</div>
      <strong>Cine Diário</strong>
      <span>Preparando seu diário...</span>
      <div class="app-startup-pulse" aria-hidden="true"></div>
    </div>
  </div>

  <nav class="navbar" id="navbar"></nav>

  <main class="container" style="padding-top: 24px; padding-bottom: 60px; max-width: 760px;">
    <div class="section-title"><h2 id="page-heading">Editar e avaliar</h2></div>

    <!-- Formulário preenchido com o título já existente -->
    <form id="title-form" hidden>
      <div class="selected-title-preview" id="selected-preview"></div>

      <div class="form-section">
        <h3>📋 Dados do título</h3>
        <div class="title-readonly-grid" id="title-readonly-data"></div>
      </div>

      <div class="form-section" id="own-review-section">
        <h3 id="own-review-title">⭐ Sua avaliação</h3>
        <div class="person-form-block">
          <div class="field">
            <label>Nota (0 a 10)</label>
            <div class="rating-input-group">
              <input type="range" id="f-nota" min="0" max="10" step="0.5" value="7" />
              <span class="rating-value" id="f-nota-display">7,0</span>
            </div>
          </div>
          <div class="field">
            <label for="f-observacao">Sua observação</label>
            <textarea id="f-observacao" rows="3" placeholder="O que você achou?"></textarea>
          </div>
          <div class="field">
            <label for="f-data-assistido">Data em que foi assistido</label>
            <input type="date" id="f-data-assistido" />
          </div>
          <button class="btn btn-secondary rating-helper-trigger" id="rating-helper-btn" type="button">
            Me ajudar a dar nota
          </button>
        </div>
      </div>

      <div class="form-section" id="other-review-section">
        <h3 id="other-review-title">Avaliações de outras pessoas</h3>
        <div class="person-form-block" id="other-review-display">
          <p class="review-pending">Aguardando avaliação.</p>
        </div>
      </div>

      <div style="display:flex; gap:10px; margin-top: 10px;">
        <button type="submit" class="btn btn-primary" id="save-btn">Salvar</button>
        <a href="catalog.html" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </main>

  <script src="../config.js"></script>
<script type="module" src="../js/pages/edit.js?v=20260925.1"></script>
</body>
</html>
